[project]
name = "ccgx-exporter"
version = "0.1.0"
description = "Prometheus exporter for the Victron Color Control GX (CCGX) via MQTT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0",
    "prometheus-client>=0.20",
]

[project.scripts]
ccgx-exporter = "main:main"

[tool.uv]
# Keep source files at the project root (no src/ layout)
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]
